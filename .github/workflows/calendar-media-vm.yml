name: Synthetic VM media adapter proof

on:
  push:
    branches: [validation/vm-media-pilot-20260913]
    paths:
      - '.github/workflows/calendar-media-vm.yml'
      - 'scripts/media-vm/**'
      - 'scripts/validation/vm-proof-*'
      - 'scripts/validation/calendar-media-vm-*'
      - 'src/social/**'
      - 'src/persistence/postgres/**'
      - 'db/calendar-migrations/**'
      - 'tests/calendar-*'
      - 'tests/helpers/**'
      - 'tests/fixtures/**'
      - 'workflows/calendar-media-vm.cjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: synthetic-calendar-media-vm
  cancel-in-progress: false

jobs:
  synthetic-vm:
    if: github.repository == 'Djohnni/ia4tube-api' && github.ref == 'refs/heads/validation/vm-media-pilot-20260913'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Sanitized candidate only, no persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Fixed Node, no dependency cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
          check-latest: false
      - name: Public tools and static compiler checks
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc ffmpeg postgresql-16
          npm ci --ignore-scripts --no-audit --no-fund
          cc -std=c11 -O2 -Wall -Wextra -Werror -Wno-misleading-indentation -D_FORTIFY_SOURCE=2 -fstack-protector-strong -o "$RUNNER_TEMP/calendar-media-supervisor-check" src/social/calendar/imports/media-process-supervisor-linux.c
      - name: VM protocol and affected legacy regressions
        id: protocol
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          cgroup_root=/sys/fs/cgroup/ia4tube-media-vm-synthetic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          sudo mkdir -- "$cgroup_root"
          sudo chmod 0755 -- "$cgroup_root"
          sudo sh -c 'printf "+cpu +memory +pids" > "$1/cgroup.subtree_control"' sh "$cgroup_root"
          env -i PATH="$PATH" LANG=C.UTF-8 \
            CALENDAR_OPERATIONAL_MEDIA_TEST_PG_BIN=/usr/lib/postgresql/16/bin \
            FFMPEG_TEST_BINARY=/usr/bin/ffmpeg \
            CALENDAR_MEDIA_LINUX_CGROUP_ROOT="$cgroup_root" \
            CALENDAR_MEDIA_LINUX_LAUNCH_MODE=sudo CALENDAR_MEDIA_LINUX_PHYSICAL=1 \
            node scripts/validation/calendar-media-vm-linux-proof.js
      - name: Installed supervisor, separate codec identity and physical scratch limit
        id: installed
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validation/vm-proof-cli.js --mode prepare --package "$RUNNER_TEMP/vm-proof-bundle.tar" --plan "$RUNNER_TEMP/vm-proof-plan.json"
          mkdir -m 700 -- "$RUNNER_TEMP/vm-proof-bundle"
          tar --no-same-owner --no-same-permissions -xf "$RUNNER_TEMP/vm-proof-bundle.tar" -C "$RUNNER_TEMP/vm-proof-bundle"
          npm --prefix "$RUNNER_TEMP/vm-proof-bundle" ci --ignore-scripts --no-audit --no-fund
          # The installed launcher requires a root-owned immutable runtime.
          # setup-node's cache may be runner-owned; use the same fixed, hashed
          # official archive that the reviewed Ubuntu bootstrap will use.
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 180 --max-filesize 67108864 \
            --output "$RUNNER_TEMP/vm-node.tar.xz" https://nodejs.org/dist/v24.15.0/node-v24.15.0-linux-x64.tar.xz
          printf '%s  %s\n' 472655581fb851559730c48763e0c9d3bc25975c59d518003fc0849d3e4ba0f6 "$RUNNER_TEMP/vm-node.tar.xz" | sha256sum -c - >/dev/null
          [[ ! -e /opt/node-v24.15.0-linux-x64 ]]
          sudo tar --no-same-owner -xJf "$RUNNER_TEMP/vm-node.tar.xz" -C /opt
          sudo env PATH=/opt/node-v24.15.0-linux-x64/bin:/usr/sbin:/usr/bin:/sbin:/bin bash "$RUNNER_TEMP/vm-proof-bundle/scripts/media-vm/preflight-ubuntu24.sh"
          sudo env PATH=/opt/node-v24.15.0-linux-x64/bin:/usr/sbin:/usr/bin:/sbin:/bin bash "$RUNNER_TEMP/vm-proof-bundle/scripts/media-vm/install-ubuntu24.sh" --synthetic-proof
          proof_status=0
          sudo -u ia4tube-coordinator env -i PATH=/usr/bin:/bin LANG=C.UTF-8 \
            /opt/ia4tube-media/runtime/usr/bin/node \
            /opt/ia4tube-media/proof/scripts/validation/vm-proof-guest.js --run || proof_status=$?
          sudo -u ia4tube-coordinator env -i PATH=/usr/bin:/bin LANG=C.UTF-8 \
            /opt/ia4tube-media/runtime/usr/bin/node \
            /opt/ia4tube-media/proof/scripts/validation/vm-proof-guest.js --collect
          [[ "$proof_status" == 0 ]]
      - name: VM pull integration under the installed coordinator identity
        if: ${{ !cancelled() && steps.installed.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/ia4tube-media/proof
          sudo -u ia4tube-coordinator env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C \
            CALENDAR_VM_INSTALLED_TEST=1 CALENDAR_OPERATIONAL_MEDIA_TEST_PG_BIN=/usr/lib/postgresql/16/bin \
            FFMPEG_TEST_BINARY=/opt/ia4tube-media/runtime/usr/bin/ffmpeg \
            /opt/ia4tube-media/runtime/usr/bin/node --test --test-concurrency=1 --test-reporter=tap \
            tests/calendar-vm-private-physical.test.js
      - name: Check only synthetic regression cgroup is empty before removal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          cgroup_root=/sys/fs/cgroup/ia4tube-media-vm-synthetic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          if [[ -d "$cgroup_root" ]]; then
            [[ "$(awk '/^populated / {print $2}' "$cgroup_root/cgroup.events")" = 0 ]]
            sudo rmdir -- "$cgroup_root"
          fi
      # Standard public-repository runner only. No artifacts, cache, paid runner,
      # provider credentials, real media or production endpoint. The disposable
      # runner owns all installed synthetic files and disappears with this job.
