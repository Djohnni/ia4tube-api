  },
  "jobs": {
    "physical-proof": {
      "if": "${{ github.event_name == 'push' && github.ref == 'refs/heads/social/gate-5a-reviewer-readiness-staging-20260830' && github.event.created == true && github.event.forced == false && github.event.before == '0000000000000000000000000000000000000000' && github.run_attempt == 1 && github.run_number == 1 }}",
      "runs-on": "ubuntu-24.04",
