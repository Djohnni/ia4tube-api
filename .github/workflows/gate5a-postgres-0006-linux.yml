            "cache": "npm"
          }
        },
        {
          "name": "Install the frozen runtime dependencies",
          "shell": "bash",
          "run": "set -Eeuo pipefail\nnpm ci --ignore-scripts --no-audit --no-fund"
        },
        {
          "name": "Pull and verify the pinned PostgreSQL image",
          "shell": "bash",
          "run": "set -Eeuo pipefail\ndocker pull \"${GATE5A_POSTGRES_IMAGE}\"\n[[ \"$(docker image inspect --format '{{.Architecture}}' \"${GATE5A_POSTGRES_IMAGE}\")\" == \"amd64\" ]]\n[[ \"$(docker image inspect --format '{{index .RepoDigests 0}}' \"${GATE5A_POSTGRES_IMAGE}\")\" == *@sha256:a10c981235b4f635e65df0cfb66a5598064628128505dbc6a3ed4ca303717521 ]]"
        },
        {
          "name": "Run the single Gate 5A physical migration proof",
          "shell": "bash",
          "run": "set -Eeuo pipefail\ncontainer_name=\"gate5a-postgres-0006-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\nlabel=\"io.ia4tube.gate5a-0006-run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\nproof_root=\"${RUNNER_TEMP}/gate5a-postgres-0006-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\n[[ \"${proof_root}\" == \"${RUNNER_TEMP}/gate5a-postgres-0006-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\" ]]\n[[ ! -e \"${proof_root}\" && ! -L \"${proof_root}\" ]]\n[[ -z \"$(docker ps --all --no-trunc --quiet --filter \"label=${label}\")\" ]]\n[[ -z \"$(docker ps --all --no-trunc --quiet --filter \"name=^/${container_name}$\")\" ]]\nmkdir -- \"${proof_root}\"\nchmod 700 \"${proof_root}\"\nsudo chown 999:999 \"${proof_root}\"\nnode_root=\"$(dirname \"$(dirname \"$(readlink -f \"$(command -v node)\")\")\")\"\n[[ -x \"${node_root}/bin/node\" ]]\ntimeout --signal=TERM --kill-after=30s 720s docker run --rm \\\n  --name \"${container_name}\" \\\n  --label \"${label}\" \\\n  --platform linux/amd64 \\\n  --network none \\\n  --read-only \\\n  --cap-drop ALL \\\n  --security-opt no-new-privileges \\\n  --user 999:999 \\\n  --workdir /workspace \\\n  --tmpfs /run:rw,noexec,nosuid,nodev,size=16m \\\n  --tmpfs /dev/shm:rw,nosuid,nodev,size=64m \\\n  --mount \"type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly\" \\\n  --mount \"type=bind,src=${node_root},dst=/opt/node,readonly\" \\\n  --mount \"type=bind,src=${proof_root},dst=/proof\" \\\n  --env TMPDIR=/proof \\\n  --env NODE_ENV=test \\\n  --env IA4TUBE_GATE5A_0006_PHYSICAL_APPROVED=I_AUTHORIZE_ONE_DISPOSABLE_POSTGRES_18_6_GATE5A_0006_RUN \\\n  --entrypoint /opt/node/bin/node \\\n  \"${GATE5A_POSTGRES_IMAGE}\" \\\n  --test --test-reporter=spec /workspace/tests/gate5a-postgres-0006-focal.test.js"
        },
        {
          "name": "Remove the exact disposable route and prove zero residue",
          "if": "always()",
          "shell": "bash",
          "run": "set -u\ncontainer_name=\"gate5a-postgres-0006-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\nlabel=\"io.ia4tube.gate5a-0006-run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\nproof_root=\"${RUNNER_TEMP}/gate5a-postgres-0006-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\n[[ \"${proof_root}\" == \"${RUNNER_TEMP}/gate5a-postgres-0006-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\" ]]\ncleanup_ok=1\nbefore_label=\"$(docker ps --all --no-trunc --quiet --filter \"label=${label}\")\" || cleanup_ok=0\nbefore_name=\"$(docker ps --all --no-trunc --quiet --filter \"name=^/${container_name}$\")\" || cleanup_ok=0\nif [[ -n \"${before_name}\" ]]; then\n  docker rm --force \"${container_name}\" >/dev/null || cleanup_ok=0\nfi\nif [[ -e \"${proof_root}\" || -L \"${proof_root}\" ]]; then\n  if [[ -L \"${proof_root}\" ]]; then\n    cleanup_ok=0\n  else\n    sudo rm -rf --one-file-system -- \"${proof_root}\" || cleanup_ok=0\n  fi\nfi\nafter_label=\"$(docker ps --all --no-trunc --quiet --filter \"label=${label}\")\" || cleanup_ok=0\nafter_name=\"$(docker ps --all --no-trunc --quiet --filter \"name=^/${container_name}$\")\" || cleanup_ok=0\nif [[ \"${cleanup_ok}\" == \"1\" && -z \"${after_label}\" && -z \"${after_name}\" && ! -e \"${proof_root}\" && ! -L \"${proof_root}\" ]]; then\n  exit 0\nfi\nexit 1"
        }
